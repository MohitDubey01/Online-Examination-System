<?xml version="1.0" encoding="UTF-8"?>
<svg width="500px" height="400px" viewBox="0 0 500 400" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
    <g transform="translate(50, 20)">
      <!-- Map background -->
      <rect fill="#f5f5f5" x="0" y="0" width="400" height="350" rx="10"></rect>
      
      <!-- Map grid lines -->
      <line x1="0" y1="50" x2="400" y2="50" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="0" y1="100" x2="400" y2="100" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="0" y1="150" x2="400" y2="150" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="0" y1="200" x2="400" y2="200" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="0" y1="250" x2="400" y2="250" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="0" y1="300" x2="400" y2="300" stroke="#e0e0e0" stroke-width="1"></line>
      
      <line x1="50" y1="0" x2="50" y2="350" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="100" y1="0" x2="100" y2="350" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="150" y1="0" x2="150" y2="350" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="200" y1="0" x2="200" y2="350" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="250" y1="0" x2="250" y2="350" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="300" y1="0" x2="300" y2="350" stroke="#e0e0e0" stroke-width="1"></line>
      <line x1="350" y1="0" x2="350" y2="350" stroke="#e0e0e0" stroke-width="1"></line>
      
      <!-- 404 text -->
      <text x="200" y="120" font-family="Arial" font-size="80" font-weight="bold" fill="#1976D2" text-anchor="middle">404</text>
      <text x="200" y="170" font-family="Arial" font-size="24" fill="#424242" text-anchor="middle">PAGE NOT FOUND</text>
      
      <!-- Compass -->
      <circle cx="350" cy="50" r="30" fill="white" stroke="#1976D2" stroke-width="2"></circle>
      <line x1="350" y1="20" x2="350" y2="80" stroke="#1976D2" stroke-width="2"></line>
      <line x1="320" y1="50" x2="380" y2="50" stroke="#1976D2" stroke-width="2"></line>
      <text x="350" y="35" font-family="Arial" font-size="12" font-weight="bold" fill="#1976D2" text-anchor="middle">N</text>
      <text x="350" y="75" font-family="Arial" font-size="12" font-weight="bold" fill="#1976D2" text-anchor="middle">S</text>
      <text x="375" y="54" font-family="Arial" font-size="12" font-weight="bold" fill="#1976D2" text-anchor="middle">E</text>
      <text x="325" y="54" font-family="Arial" font-size="12" font-weight="bold" fill="#1976D2" text-anchor="middle">W</text>
      
      <!-- Lost person -->
      <g transform="translate(150, 230)">
        <!-- Head -->
        <circle cx="50" cy="20" r="15" fill="#F50057"></circle>
        
        <!-- Body -->
        <line x1="50" y1="35" x2="50" y2="70" stroke="#F50057" stroke-width="6"></line>
        
        <!-- Arms -->
        <line x1="50" y1="45" x2="30" y2="60" stroke="#F50057" stroke-width="4"></line>
        <line x1="50" y1="45" x2="70" y2="60" stroke="#F50057" stroke-width="4"></line>
        
        <!-- Legs -->
        <line x1="50" y1="70" x2="40" y2="100" stroke="#F50057" stroke-width="4"></line>
        <line x1="50" y1="70" x2="60" y2="100" stroke="#F50057" stroke-width="4"></line>
        
        <!-- Confused face -->
        <circle cx="45" cy="18" r="2" fill="white"></circle>
        <circle cx="55" cy="18" r="2" fill="white"></circle>
        <path d="M45,25 Q50,22 55,25" stroke="white" stroke-width="1" fill="none"></path>
        
        <!-- Question mark thought bubble -->
        <circle cx="85" cy="10" r="15" fill="white" stroke="#F50057" stroke-width="1"></circle>
        <text x="85" y="15" font-family="Arial" font-size="16" font-weight="bold" fill="#F50057" text-anchor="middle">?</text>
      </g>
      
      <!-- Map landmark pins -->
      <g transform="translate(80, 50)">
        <circle cx="0" cy="0" r="8" fill="#4CAF50"></circle>
        <path d="M0,0 L0,15" stroke="#4CAF50" stroke-width="3"></path>
      </g>
      
      <g transform="translate(320, 250)">
        <circle cx="0" cy="0" r="8" fill="#FF9800"></circle>
        <path d="M0,0 L0,15" stroke="#FF9800" stroke-width="3"></path>
      </g>
      
      <g transform="translate(100, 280)">
        <circle cx="0" cy="0" r="8" fill="#9C27B0"></circle>
        <path d="M0,0 L0,15" stroke="#9C27B0" stroke-width="3"></path>
      </g>
      
      <!-- Dotted path -->
      <path d="M200,330 Q230,300 260,310 Q290,320 300,280 Q310,240 270,220 Q230,200 230,170 Q230,140 250,120" stroke="#F50057" stroke-width="2" stroke-dasharray="5,5" fill="none"></path>
      
      <!-- Text at bottom -->
      <text x="200" y="330" font-family="Arial" font-size="16" fill="#424242" text-anchor="middle">Let's get you back on track</text>
    </g>
  </g>
</svg>